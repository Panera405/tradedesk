name: Hourly trade scan

on:
  schedule:
    # Hourly, 13:10-21:10 UTC, Mon-Fri. Covers US market hours in both EDT and EST.
    # The script itself skips runs when the US market is closed.
    - cron: "10 13-21 * * 1-5"
  workflow_dispatch:        # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EQUITY: ${{ vars.EQUITY }}
        run: |
          FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then FLAG="--only-market-hours"; fi
          python trade_desk.py $FLAG --detail --out docs/index.html \
            --equity "${EQUITY:-25000}" --state alerts_state.json

     
      - name: Save results
        run: |
          git config user.name "trade-desk-bot"
          git config user.email "bot@users.noreply.github.com"

          # Stage only the intended scan outputs
          git add docs alerts_state.json

          if git diff --cached --quiet; then
            echo "Nothing to save"
            exit 0
          fi

          git commit -m "Scan $(date -u +%Y-%m-%dT%H:%MZ)"

          # Stash unrelated uncommitted changes
          git stash push --include-untracked -m "temporary scan changes"

          # Retry synchronization if another run updated main
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main; then
              if git push origin HEAD:main; then
                echo "Scan results saved successfully"
                exit 0
              fi
            fi

            # Stop rather than retry in a conflicted state
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
            fi

            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

          echo "Failed to save scan results"
          exit 1
